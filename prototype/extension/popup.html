<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tesi E-commerce Demo</title>
  <link rel="stylesheet" href="style.css">
  <!--detector condiviso caricato prima del popup-->
  <script src="product_detector.js" defer></script>
  <!--logica del popup estensione-->
  <script src="popup.js" defer></script>
</head>
<body class="extension-popup">
  <main class="popup-shell">
    <!--intestazione compatta del popup-->
    <header class="popup-header">
      <div>
        <p class="popup-kicker">Demo della tesi</p>
        <h1>Product Discovery</h1>
      </div>
      <div id="backendStatus" class="status-pill status-muted" role="status">Connessione…</div>
    </header>

    <!--riconoscimento prodotto locale o Amazon-->
    <section class="popup-section" aria-labelledby="currentProductTitle">
      <div class="section-heading">
        <h2 id="currentProductTitle">Prodotto aperto</h2>
        <p id="productPageStatus" class="source-pill">Rilevamento…</p>
      </div>
      <div id="productResult" class="result-box muted-text" aria-live="polite">Cerco il prodotto nella scheda corrente.</div>
    </section>

    <!--raccomandazioni contestuali dal backend o dalla pagina Amazon reale-->
    <section id="recommendationsSection" class="popup-section" aria-labelledby="recommendationsTitle">
      <div class="section-heading">
        <h2 id="recommendationsTitle">Consigli contestuali</h2>
        <span id="recommendationsStatus" class="source-pill" role="status">In attesa…</span>
      </div>
      <div id="recommendationsList" class="recommendations-list">
        <p class="empty-list-item">Caricamento dei suggerimenti…</p>
      </div>
      <div id="recommendationDetail" class="recommendation-detail hidden"></div>
    </section>
  </main>
</body>
</html>
