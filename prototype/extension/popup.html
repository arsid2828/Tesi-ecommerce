<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tesi E-commerce Demo</title>
  <link rel="stylesheet" href="style.css">
  <!--detector condiviso caricato prima del popup-->
  <script src="product_detector.js" defer></script>
  <!--logica del popup estensione-->
  <script src="popup.js" defer></script>
</head>
<body class="extension-popup">
  <main class="popup-shell">
    <!--intestazione compatta del popup-->
    <header class="popup-header">
      <p class="popup-kicker">Prototipo tesi</p>
      <h1>Tesi E-commerce Demo</h1>
    </header>

    <!--stato backend e URL della tab attiva-->
    <section class="popup-section">
      <div id="backendStatus" class="status-pill status-muted">Controllo backend...</div>
      <p class="label">Tab corrente</p>
      <p id="currentUrl" class="url-value">URL non disponibile</p>
    </section>

    <!--riconoscimento prodotto locale o Amazon-->
    <section class="popup-section">
      <p class="label">Pagina prodotto</p>
      <p id="productPageStatus" class="muted-text">Verifica URL in corso...</p>
      <p id="itemIdValue" class="item-id-value">item_id non rilevato</p>
      <button id="loadProductButton" class="primary-button" type="button" disabled>Carica prodotto</button>
      <div id="productResult" class="result-box muted-text">Nessun prodotto caricato.</div>
    </section>

    <!--raccomandazioni contestuali dal backend o dalla pagina Amazon reale-->
    <section class="popup-section">
      <div class="section-heading">
        <h2>Consigli contestuali</h2>
        <span id="recommendationsStatus" class="small-muted">Caricamento...</span>
      </div>
      <div id="recommendationsList" class="recommendations-list"></div>
    </section>
  </main>
</body>
</html>
